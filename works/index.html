<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Works — OXX Lab</title>
    <meta name="description" content="Selected works and projects by OXX Lab — computational design studio." />
    <link rel="canonical" href="https://oxxlab.com/works" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f8f8fd;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        .slide {
            background-color: #f8f8fd;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Navigation */
        .nav-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 37px 56px;
            z-index: 20;
        }

        .nav-right {
            display: flex;
            gap: 32px;
        }

        .nav-bar a {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: #141414;
            font-size: 20px;
            text-decoration: none;
            line-height: 27px;
            transition: opacity 0.3s ease;
        }

        .nav-bar a:hover {
            opacity: 0.8;
        }

        /* Left Side - Project Title */
        .project-sidebar {
            position: absolute;
            top: 0;
            left: 0;
            width: 28%;
            min-width: 260px;
            max-width: 420px;
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 58px;
        }

        .project-info-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .play-icon {
            width: 20px;
            height: 18px;
            color: #141414;
            flex-shrink: 0;
            margin-top: 12px;
            transition: color 0.3s ease;
        }

        .play-icon svg {
            width: 100%;
            height: 100%;
        }

        .project-info {
            transition: transform 0.3s ease;
        }

        .project-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(36px, 3.75vw, 72px);
            font-weight: 700;
            line-height: 1.07;
            letter-spacing: -0.02em;
            color: #141414;
            margin-bottom: 20px;
            transition: opacity 0.3s ease;
        }

        .project-description {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(14px, 1vw, 19px);
            font-weight: 700;
            line-height: 1.47;
            letter-spacing: -0.02em;
            color: #141414;
            max-width: 310px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-description.visible {
            opacity: 1;
        }

        /* Right Side - Project Logos */
        .projects-container {
            position: absolute;
            top: 100px;
            right: 0;
            left: 28%;
            bottom: 0;
            min-left: 260px;
        }

        .project-item {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .project-logo {
            width: clamp(100px, 10.4vw, 200px);
            height: clamp(100px, 10.4vw, 200px);
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #141414;
            transition: color 0.3s ease;
            flex-shrink: 0;
        }

        .project-logo svg {
            width: 100%;
            height: 100%;
        }

        .project-item:hover .project-logo {
            color: #FF4D00;
        }

        .project-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(16px, 1.35vw, 26px);
            font-weight: 700;
            line-height: 1.04;
            letter-spacing: -0.025em;
            color: #141414;
            text-align: center;
            margin-top: 20px;
            transition: color 0.3s ease;
            white-space: pre-line;
        }

        .project-item:hover .project-name {
            color: #FF4D00;
        }

        /* Focus States */
        .nav-bar a:focus {
            outline: 2px solid #4a90e2;
            outline-offset: 2px;
        }

        /* Responsive: Tablet */
        @media (max-width: 1024px) {
            .nav-bar {
                padding: 24px 32px;
            }

            .nav-bar a {
                font-size: 16px;
            }

            .project-sidebar {
                width: 220px;
                min-width: 180px;
                padding-left: 32px;
            }

            .projects-container {
                left: 220px;
                top: 80px;
            }
        }

        /* Responsive: Mobile */
        @media (max-width: 680px) {
            body {
                overflow: auto;
            }

            .slide {
                height: auto;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .nav-bar {
                position: relative;
                padding: 20px 24px;
            }

            .nav-bar a {
                font-size: 14px;
            }

            .nav-right {
                gap: 20px;
            }

            .project-sidebar {
                position: relative;
                width: 100%;
                max-width: none;
                min-width: 0;
                height: auto;
                padding: 20px 24px;
                display: block;
            }

            .project-info-wrapper {
                align-items: center;
                gap: 10px;
            }

            .play-icon {
                margin-top: 0;
            }

            .project-title {
                font-size: 32px;
                margin-bottom: 8px;
            }

            .project-description {
                font-size: 14px;
            }

            .projects-container {
                position: relative;
                top: 0;
                left: 0;
                right: 0;
                bottom: auto;
                width: 100%;
                min-height: 60vh;
                padding: 20px;
            }

            .project-item {
                position: relative !important;
                left: auto !important;
                top: auto !important;
                margin: 0 auto 40px;
            }

            .project-logo {
                width: 120px;
                height: 120px;
            }

            .project-name {
                font-size: 16px;
                margin-top: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <main class="slide">
        <header role="banner">
            <nav class="nav-bar" role="navigation" aria-label="Main navigation">
                <a href="/">oxx studio</a>
                <div class="nav-right">
                    <a href="/lab">lab</a>
                    <a href="/works">works</a>
                </div>
            </nav>
        </header>

        <div class="project-sidebar">
            <div class="project-info-wrapper">
                <div class="play-icon">
                    <svg width="20" height="18" viewBox="0 0 20 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 9L0.499999 17.6603L0.5 0.339746L20 9Z" fill="currentColor"/>
                    </svg>
                </div>
                <div class="project-info">
                    <h1 class="project-title">WORKS</h1>
                    <p class="project-description">breif info about the project</p>
                </div>
            </div>
        </div>

        <div class="projects-container" id="projectsContainer"></div>
    </main>

    <script>
        const projects = [
            {
                name: 'SHAPER',
                description: 'breif info about the project',
                link: '/works/shaper/configure',
                svg: `<svg viewBox="0 0 198.84 118.87" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="46.96 0 46.96 47.95 70.94 47.95 70.94 70.92 103.92 70.92 103.92 23.97 150.88 23.97 150.88 46.95 198.84 46.95 198.84 94.9 150.88 94.9 150.88 71.92 116.91 71.92 116.91 118.87 69.94 118.87 69.94 96.9 23.98 96.9 23.98 49.45 22.48 47.95 0 47.95 0 0 46.96 0" fill="currentColor"/>
                </svg>`
            }
        ];

        let currentHoveredProject = null;
        let resetTimeout = null;

        function getLogoSize() {
            const vw = window.innerWidth;
            return Math.min(200, Math.max(100, vw * 0.104));
        }

        function isOverlapping(rect1, rect2) {
            return !(rect1.right < rect2.left ||
                     rect1.left > rect2.right ||
                     rect1.bottom < rect2.top ||
                     rect1.top > rect2.bottom);
        }

        function getRandomPosition(existingPositions, containerWidth, containerHeight, itemWidth, itemHeight) {
            const maxAttempts = 100;
            let attempts = 0;
            const textSpace = 50;

            while (attempts < maxAttempts) {
                const x = Math.random() * (containerWidth - itemWidth);
                const y = Math.random() * (containerHeight - itemHeight - textSpace);

                const newRect = {
                    left: x,
                    top: y,
                    right: x + itemWidth,
                    bottom: y + itemHeight + textSpace
                };

                let overlaps = false;
                for (const existingRect of existingPositions) {
                    if (isOverlapping(newRect, existingRect)) {
                        overlaps = true;
                        break;
                    }
                }

                if (!overlaps) {
                    return { x, y, rect: newRect };
                }

                attempts++;
            }

            const x = Math.random() * (containerWidth - itemWidth);
            const y = Math.random() * (containerHeight - itemHeight - textSpace);
            return {
                x,
                y,
                rect: {
                    left: x,
                    top: y,
                    right: x + itemWidth,
                    bottom: y + itemHeight + textSpace
                }
            };
        }

        function createProjects() {
            const container = document.getElementById('projectsContainer');
            container.innerHTML = '';
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;
            const logoSize = getLogoSize();
            const existingPositions = [];

            projects.forEach((project, index) => {
                const position = getRandomPosition(existingPositions, containerWidth, containerHeight, logoSize, logoSize);
                existingPositions.push(position.rect);

                const projectItem = document.createElement('div');
                projectItem.className = 'project-item';
                projectItem.style.left = position.x + 'px';
                projectItem.style.top = position.y + 'px';

                const logo = document.createElement('div');
                logo.className = 'project-logo';

                if (project.svg) {
                    logo.innerHTML = project.svg;
                } else {
                    logo.style.backgroundColor = '#141414';
                }

                const name = document.createElement('div');
                name.className = 'project-name';
                name.textContent = project.name;

                projectItem.appendChild(logo);
                projectItem.appendChild(name);
                container.appendChild(projectItem);

                projectItem.addEventListener('click', () => {
                    if (project.link && project.link !== '#') {
                        window.location.href = project.link;
                    }
                });

                projectItem.addEventListener('mouseenter', () => {
                    if (resetTimeout) {
                        clearTimeout(resetTimeout);
                        resetTimeout = null;
                    }
                    currentHoveredProject = project;
                    updateProjectInfo(project);
                });

                projectItem.addEventListener('mouseleave', () => {
                    if (currentHoveredProject === project) {
                        currentHoveredProject = null;
                        resetTimeout = setTimeout(() => {
                            if (!currentHoveredProject) {
                                resetProjectInfo();
                            }
                            resetTimeout = null;
                        }, 3000);
                    }
                });
            });
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(createProjects, 250);
        });

        function updateProjectInfo(project) {
            const title = document.querySelector('.project-title');
            const description = document.querySelector('.project-description');
            const projectInfo = document.querySelector('.project-info');
            const playIcon = document.querySelector('.play-icon');

            const displayName = project.name.replace('\n', ' ');
            title.textContent = displayName;
            description.textContent = project.description;
            description.classList.add('visible');

            if (project.name.includes('\n')) {
                projectInfo.classList.add('two-lines');
                playIcon.classList.add('two-lines');
            } else {
                projectInfo.classList.remove('two-lines');
                playIcon.classList.remove('two-lines');
            }
        }

        function resetProjectInfo() {
            const title = document.querySelector('.project-title');
            const description = document.querySelector('.project-description');
            const projectInfo = document.querySelector('.project-info');
            const playIcon = document.querySelector('.play-icon');

            title.textContent = 'WORKS';
            description.classList.remove('visible');
            projectInfo.classList.remove('two-lines');
            playIcon.classList.remove('two-lines');
        }

        createProjects();
    </script>
</body>
</html>
