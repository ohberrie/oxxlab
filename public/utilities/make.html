<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OXX / MAKE — Panel Flatten</title><style>body{font:14px Arial,sans-serif;max-width:1200px;margin:40px auto;padding:0 25px;color:#252d27}a{color:inherit}header{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:20px 0}h1{font-weight:400;font-size:36px}p{color:#888;line-height:1.8}canvas{width:100%;display:block}#controls{display:flex;gap:25px;flex-wrap:wrap;padding:25px 0}label{display:grid;gap:10px;font-size:12px}button,select{background:white;border:1px solid #bbb;padding:8px}input{accent-color:#456b56}small{color:#999}</style><header><a href="/">OXX OS ← ENGINE</a><span>UTILITY / MAKE</span></header><h1>Panel flattening.</h1><p>입체 판재의 면을 추출하고 밑변을 정렬하는 기존 시뮬레이션.<br>데모 형상 기반 프리뷰이며 제작 파일 업로드·내보내기는 지원하지 않습니다.</p><canvas aria-label="3D panels and flattened 2D drawings"></canvas><div id="controls"></div><p id="status"></p><small>Original simulation preserved from ohberrie/oxx_os · panel-flatten-sim.js</small><script src="panel-flatten-sim.js"></script><script>const sim=window.SIMS['panel-flatten'](document.querySelector('canvas'),{});sim.controls.forEach(c=>{const l=document.createElement('label');l.textContent=c.label||'형상';let el;if(c.type==='button'){el=document.createElement('button');el.textContent=c.label;el.onclick=()=>sim.act(c.key)}else if(c.options){el=document.createElement('select');c.options.forEach(o=>{const opt=document.createElement('option');opt.value=o.value;opt.textContent=o.label;el.append(opt)});el.value=c.value;el.onchange=()=>sim.set(c.key,el.value)}else{el=document.createElement('input');el.type=c.type==='toggle'?'checkbox':'range';el.min=c.min;el.max=c.max;el.step=c.step||1;el.value=c.value;el.checked=!!c.value;el.oninput=()=>sim.set(c.key,c.type==='toggle'?+el.checked:+el.value)}el.setAttribute('aria-label',c.label||'형상');l.append(el);document.querySelector('#controls').append(l)});sim.onStatus(s=>document.querySelector('#status').textContent=s);window.addEventListener('pagehide',()=>sim.destroy());</script></html>
