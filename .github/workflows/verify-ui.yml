name: Verify OXX UI
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/formal-circuit-engine-20261031]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: node tests/geometry.mjs
      - run: npm run build
