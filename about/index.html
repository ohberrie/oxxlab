<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>About — OXX Lab</title>
    <meta name="description" content="About OXX Lab — a computational design studio exploring algorithmic form, spatial systems, and AI-driven design." />
    <link rel="canonical" href="https://oxxlab.com/about" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #f8f8fd;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'JetBrains Mono', monospace;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 37px 56px;
        }

        .nav-right { display: flex; gap: 32px; }

        .nav-bar a {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: #141414;
            font-size: 20px;
            text-decoration: none;
            line-height: 27px;
            transition: opacity 0.3s ease;
        }

        .nav-bar a:hover { opacity: 0.8; }

        .content {
            display: flex;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 101px);
        }

        .page-title {
            font-size: clamp(36px, 5vw, 72px);
            font-weight: 700;
            color: #141414;
            letter-spacing: -0.02em;
        }

        @media (max-width: 680px) {
            .nav-bar { padding: 20px 24px; }
            .nav-bar a { font-size: 14px; }
            .nav-right { gap: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <nav class="nav-bar" role="navigation" aria-label="Main navigation">
            <a href="/">oxx studio</a>
            <div class="nav-right">
                <a href="/lab">lab</a>
                <a href="/works">works</a>
            </div>
        </nav>
    </header>
    <main class="content">
        <h1 class="page-title">ABOUT</h1>
    </main>
</body>
</html>
